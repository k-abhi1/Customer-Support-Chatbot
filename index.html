<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Support Bot · Chat</title>
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-wrapper">
        <!-- Header with bot info & logout -->
        <div class="chat-header">
            <div class="header-left">
                <div class="bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bot-info">
                    <h2>AI Support Assistant</h2>
                    <span class="status online"><i class="fas fa-circle"></i> Online</span>
                </div>
            </div>
            <button id="logoutBtn" class="logout-btn" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>

        <!-- Chat messages container -->
        <div id="chatBox" class="chat-messages">
            <!-- Initial bot message -->
            <div class="message-row bot-row">
                <div class="avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <div class="message-bubble">
                        <p>👋 Hello! I'm your virtual assistant. You can ask me questions or upload an image for text extraction.</p>
                    </div>
                    <span class="timestamp">just now</span>
                </div>
            </div>
        </div>

        <!-- Typing indicator (hidden by default) -->
        <div id="typingIndicator" class="typing-indicator" style="display: none;">
            <div class="avatar">
                <i class="fas fa-robot"></i>
            </div>
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Input area -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <button id="attachBtn" class="attach-btn" title="Upload image">
                    <i class="fas fa-paperclip"></i>
                </button>
                <input type="file" id="imageUpload" accept="image/*" hidden>
                <input type="text" id="userInput" class="chat-input" placeholder="Type your message..." autocomplete="off">
                <button id="sendBtn" class="send-btn" title="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="scrip.js"></script>
</body>
</html>
