<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Customer Support Chatbot</title>
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== style.css – AI Customer Support Chatbot ===== */
        /* Modern glassmorphism design – Dark theme             */
        /* Unified styles for Login & Chat pages – Single File */

        /* ----- Global Reset & Fonts ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* ----- Animations ----- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ===== LOGIN PAGE ===== */
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .login-container h2 {
            color: white;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #loginForm {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #loginForm input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 16px 24px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        #loginForm input:focus {
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        #loginForm input::placeholder {
            color: #94a3b8;
        }

        #loginForm button {
            background: linear-gradient(145deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 50px;
            padding: 16px 24px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
        }

        #loginForm button:hover {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(37, 99, 235, 0.4);
        }

        .error {
            color: #f87171;
            margin-top: 16px;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }

        /* ===== CHAT PAGE ===== */
        .chat-wrapper {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            max-height: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease;
        }

        /* ----- Chat Header ----- */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            background: rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .bot-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #3b82f6, #2563eb);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
        }

        .bot-info h2 {
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .status {
            color: #94a3b8;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status.online i {
            color: #22c55e;
            font-size: 10px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ----- Chat Messages Area ----- */
        .chat-messages {
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        /* Message Row */
        .message-row {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .bot-row {
            align-self: flex-start;
        }

        .user-row {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        /* Avatar */
        .avatar {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
        }

        .user-row .avatar {
            background: linear-gradient(145deg, #8b5cf6, #7c3aed);
        }

        /* Message Content */
        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-row .message-bubble {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            border: none;
            color: white;
        }

        /* OCR specific styling */
        .message-row.ocr-row .message-bubble {
            background: rgba(34, 197, 94, 0.15);
            border-left: 4px solid #22c55e;
            color: #dcfce7;
        }

        .message-bubble p {
            margin: 0;
        }

        .message-bubble p:not(:last-child) {
            margin-bottom: 8px;
        }

        /* Timestamp */
        .timestamp {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-left: 8px;
        }

        .user-row .timestamp {
            text-align: right;
        }

        /* ----- Typing Indicator ----- */
        .typing-indicator {
            display: flex;
            gap: 12px;
            padding: 12px 28px;
            align-items: center;
        }

        .typing-dots {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 20px;
            display: flex;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        /* ----- Chat Input Area ----- */
        .chat-input-area {
            padding: 20px 28px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 4px 4px 4px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .attach-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attach-btn:hover {
            color: white;
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 0;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .chat-input::placeholder {
            color: #64748b;
        }

        .send-btn {
            background: linear-gradient(145deg, #3b82f6, #2563eb);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .send-btn:hover {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            transform: scale(1.05);
        }

        /* ----- Utility ----- */
        .hidden {
            display: none !important;
        }

        /* ----- Mobile Responsive ----- */
        @media (max-width: 640px) {
            body { padding: 0; }
            .chat-wrapper {
                max-width: 100%;
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
            .chat-header { padding: 16px 20px; }
            .chat-messages { padding: 20px; }
            .message-row { max-width: 90%; }
            .chat-input-area { padding: 16px 20px; }
            .login-container {
                border-radius: 24px;
                margin: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- LOGIN VIEW -->
    <div id="loginView" class="login-container">
        <h2><i class="fas fa-robot"></i> Support Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required autofocus>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        </form>
        <div id="loginError" class="error"></div>
    </div>

    <!-- CHAT VIEW (hidden by default) -->
    <div id="chatView" class="chat-wrapper hidden">
        <div class="chat-header">
            <div class="header-left">
                <div class="bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bot-info">
                    <h2>AI Support Assistant</h2>
                    <span class="status online"><i class="fas fa-circle"></i> Online</span>
                </div>
            </div>
            <button id="logoutBtn" class="logout-btn" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>

        <!-- Chat messages container -->
        <div id="chatBox" class="chat-messages">
            <!-- Initial bot message will be inserted by JS -->
        </div>

        <!-- Typing indicator (hidden by default) -->
        <div id="typingIndicator" class="typing-indicator hidden">
            <div class="avatar">
                <i class="fas fa-robot"></i>
            </div>
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Input area -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <button id="attachBtn" class="attach-btn" title="Upload image">
                    <i class="fas fa-paperclip"></i>
                </button>
                <input type="file" id="imageUpload" accept="image/*" hidden>
                <input type="text" id="userInput" class="chat-input" placeholder="Type your message..." autocomplete="off">
                <button id="sendBtn" class="send-btn" title="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ===== script.js – AI Customer Support Chatbot =====
        // Complete frontend logic – Single file (HTML+CSS+JS)

        // Configuration
        const API_BASE = 'http://localhost:5000';  // Change if deployed

        // DOM Elements
        const loginView = document.getElementById('loginView');
        const chatView = document.getElementById('chatView');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const imageUpload = document.getElementById('imageUpload');
        const typingIndicator = document.getElementById('typingIndicator');

        // ---------- Helper Functions ----------
        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return `${hours}:${minutes} ${ampm}`;
        }

        // Append a message to chat
        function appendMessage(sender, text, isOCR = false) {
            const messageRow = document.createElement('div');
            messageRow.className = `message-row ${sender === 'user' ? 'user-row' : 'bot-row'}`;
            
            // Avatar
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.innerHTML = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
            
            // Content wrapper
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // Bubble
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            if (isOCR) {
                messageRow.classList.add('ocr-row');
                bubbleDiv.innerHTML = `<p><i class="fas fa-file-image"></i> Extracted text:</p><p style="font-family: monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px;">${text}</p>`;
            } else {
                bubbleDiv.innerHTML = `<p>${text}</p>`;
            }
            
            // Timestamp
            const timeSpan = document.createElement('span');
            timeSpan.className = 'timestamp';
            timeSpan.textContent = getCurrentTime();
            
            contentDiv.appendChild(bubbleDiv);
            contentDiv.appendChild(timeSpan);
            messageRow.appendChild(avatarDiv);
            messageRow.appendChild(contentDiv);
            
            chatBox.appendChild(messageRow);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Clear chat and add welcome message
        function initChat() {
            chatBox.innerHTML = '';
            appendMessage('bot', '👋 Hello! I\'m your virtual assistant. You can ask me questions or upload an image for text extraction.');
        }

        // Show/hide views based on authentication
        function showLogin() {
            loginView.classList.remove('hidden');
            chatView.classList.add('hidden');
        }

        function showChat() {
            loginView.classList.add('hidden');
            chatView.classList.remove('hidden');
            initChat();
        }

        // Check token on load
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                // Optionally verify token with backend? For simplicity assume valid.
                showChat();
            } else {
                showLogin();
            }
        }

        // Handle unauthorized response
        function handleUnauthorized() {
            localStorage.removeItem('token');
            showLogin();
        }

        // ---------- Login ----------
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                loginError.textContent = 'Please enter username and password';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    showChat();
                } else {
                    loginError.textContent = data.error || 'Invalid credentials';
                }
            } catch (err) {
                loginError.textContent = 'Server error. Make sure backend is running.';
                console.error(err);
            }
        });

        // ---------- Logout ----------
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('token');
            showLogin();
        });

        // ---------- Send Message ----------
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';

            // Show typing indicator
            typingIndicator.classList.remove('hidden');

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                
                // Hide typing indicator
                typingIndicator.classList.add('hidden');

                if (response.ok) {
                    appendMessage('bot', data.reply);
                } else {
                    appendMessage('bot', '❌ Error: ' + (data.error || 'Unable to get response'));
                    if (response.status === 401) handleUnauthorized();
                }
            } catch (err) {
                typingIndicator.classList.add('hidden');
                appendMessage('bot', '❌ Network error. Please check your connection.');
                console.error(err);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ---------- Image OCR ----------
        attachBtn.addEventListener('click', () => {
            imageUpload.click();
        });

        imageUpload.addEventListener('change', async (e) => {
            if (e.target.files.length === 0) return;
            const file = e.target.files[0];
            appendMessage('user', `📎 Uploaded: ${file.name}`);

            const formData = new FormData();
            formData.append('image', file);

            // Show typing indicator
            typingIndicator.classList.remove('hidden');

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/ocr`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await response.json();

                typingIndicator.classList.add('hidden');

                if (response.ok) {
                    appendMessage('bot', data.text, true);
                } else {
                    appendMessage('bot', '❌ OCR Error: ' + (data.error || 'Could not process image'));
                    if (response.status === 401) handleUnauthorized();
                }
            } catch (err) {
                typingIndicator.classList.add('hidden');
                appendMessage('bot', '❌ OCR failed. Please try again.');
                console.error(err);
            }

            // Clear input to allow re-upload of same file
            imageUpload.value = '';
        });

        // ---------- Initial Check ----------
        checkAuth();
    </script>
</body>
</html>
